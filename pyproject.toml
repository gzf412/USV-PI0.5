[project]
name = "usv-vla"
version = "0.1.0"
description = "USV-only pi0.5 model, dynamic simulation and demonstrations"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "pillow>=11.0.0",
  "jax==0.5.3",
  "jaxlib==0.5.3",
  "flax==0.10.2",
  "orbax-checkpoint==0.11.13",
  "optax==0.2.4",
  "ml-dtypes==0.4.1",
  "tensorstore==0.1.74",
  "torch==2.7.1",
  "lerobot @ git+https://github.com/huggingface/lerobot.git@0cf864870cf29f4738d3ade893e6fd13fbd7cdb5",
  "augmax>=0.3.4",
  "einops>=0.8.0",
  "etils[epath]>=1.12.0",
  "fsspec[gcs]>=2024.6.0",
  "jaxtyping==0.2.36",
  "sentencepiece==0.2.0",
  "numpydantic==1.6.9",
  "pydantic>=2.11,<3",
  "tqdm-loggable>=0.2",
  "typing-extensions>=4.12.2",
  "tyro>=0.9.5",
  "wandb>=0.19.1",
  "filelock>=3.16.1",
  "beartype==0.19.0",
  "chex==0.1.90",
  "treescope>=0.1.7",
  "websockets>=14",
  "msgpack>=1.1.0",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]==0.5.3"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
